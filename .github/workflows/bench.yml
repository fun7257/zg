name: Performance

# Runs when something is pushed or merged into the `perf` branch: to measure a change, merge it
# into `perf`. Every platform and CPU level in the matrix below runs the whole benchmark
# (.github/bench.sh): zg against ripgrep on the 39 standard cases and the 54 stress cases, on all
# cores and on one thread, small files and `-m`, and on the first of each platform the peak memory
# and the first read from disk; and the new state of the branch against the one before the push,
# both builds alternating on the same machine so that the noise of a shared runner affects them
# alike. The last job merges the reports into one (job summary and artifact `bench-summary`). A
# job fails when the geometric mean over the 39 cases is more than `threshold` percent slower than
# the previous state. Runners are shared machines: read single cases as indications, the mean as
# the result. Also weekly on the default branch (against ripgrep only), and by hand with a ref to
# compare with.
#
# CPU levels. One job per platform, and in it every CPU level one after the other
# (.github/bench-variants.sh): a hosted runner is a different CPU model from one job to the next,
# and the levels can only be compared with each other on the same machine. x86-64: the portable
# build (`-Dcpu=baseline`) carries cores for v1 (SSE2), v2 (SSE4.2, POPCNT) and v3 (AVX2, BMI2,
# FMA) and runs each of them in turn (ZG_CPU_LEVEL); v4 (AVX-512) is a build for x86-64-v4, run
# where the CPU has AVX-512; native is the build for the runner's own CPU. arm64: baseline (ARMv8-A
# with NEON, which zg uses on every arm64 CPU) and native. macOS arm64: native (Zig's baseline for
# it is the M1: the same build).

on:
  push:
    branches: [perf]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Also compare with this branch, tag or commit (A/B against it)"
        required: false
        default: ""
      runs:
        description: "Runs per case"
        required: false
        default: "9"
      threshold:
        description: "Fail when slower than the base by more than this many percent (0: never)"
        required: false
        default: "15"

permissions:
  contents: read

# A push to `perf` waits for the run before it (each one is a measurement worth keeping);
# the others replace a run in progress.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  RUNS: ${{ inputs.runs || '9' }}
  THRESHOLD: ${{ inputs.threshold || '15' }}

jobs:
  bench:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: x86
            name: Linux x86-64
            os: ubuntu-latest
          - id: arm
            name: Linux arm64
            os: ubuntu-24.04-arm
          - id: mac
            name: macOS arm64
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install ripgrep
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          fi

      # What to compare with: where `perf` was before this push, or the ref asked for by hand.
      - name: Find the base
        id: base
        env:
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          ref="${BASE_REF:-$BEFORE}"
          case "$ref" in 0*[!0]*) ;; 0*) ref="" ;; esac # a new branch: all zeros
          # A commit, a tag, or a branch: the checkout has the branches only as origin/NAME.
          if [ -n "$ref" ]; then
            found=""
            for candidate in "$ref" "origin/$ref"; do
              if found=$(git rev-parse --verify --quiet "$candidate^{commit}"); then break; fi
              found=""
            done
            if [ -z "$found" ]; then
              echo "$ref is not a commit, tag or branch of this repository (or a forced push removed it)."
            fi
            ref="$found"
          fi
          [ -z "$ref" ] && echo "No base: zg against ripgrep only."
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Benchmark
        shell: bash
        env:
          PLATFORM: ${{ matrix.id }}
          BASE: ${{ steps.base.outputs.ref }}
        run: |
          args=(--out bench-out --runs "$RUNS" --threshold "$THRESHOLD")
          if [ -n "$BASE" ]; then
            args+=(--base-ref "$BASE")
          fi
          set +e
          .github/bench-variants.sh "$PLATFORM" "${args[@]}"
          status=$?
          set -e
          for f in bench-out/*.md; do
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.id }}
          path: bench-out

  # One report of all of them: the headline numbers per platform and CPU level, the change
  # against the base, a few cases side by side, the machines; and every row as CSV.
  report:
    name: Report
    needs: bench
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: reports

      - name: Merge the reports
        run: |
          mkdir summary
          python3 .github/summarize.py reports/*/*.md --csv summary/results.csv > summary/summary.md
          cat summary/summary.md | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: bench-summary
          path: summary
